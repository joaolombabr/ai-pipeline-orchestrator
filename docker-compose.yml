version: "3.9"

services:

  # ── API ──────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pipeline_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pipeline_net

  # ── WORKER (Celery) ───────────────────────────────
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pipeline_worker
    restart: unless-stopped
    env_file: .env
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pipeline_net

  # ── BEAT (agendador Celery) ───────────────────────
  beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pipeline_beat
    restart: unless-stopped
    env_file: .env
    command: celery -A core.celery_app beat --loglevel=info
    volumes:
      - ./api:/app
    depends_on:
      - redis
    networks:
      - pipeline_net

  # ── FLOWER (monitor de tarefas) ───────────────────
  flower:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pipeline_flower
    restart: unless-stopped
    env_file: .env
    command: celery -A core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    networks:
      - pipeline_net

  # ── POSTGRESQL ────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pipeline_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline_net

  # ── REDIS ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pipeline_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline_net

  # ── NGINX (reverse proxy) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pipeline_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - pipeline_net

volumes:
  postgres_data:
  redis_data:

networks:
  pipeline_net:
    driver: bridge
